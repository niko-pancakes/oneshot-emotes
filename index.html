<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relocating...</title>
    <style>
        :root {
            --oneshot-black: #100810;
            --oneshot-gold: #ffaa00;
            --oneshot-orange: #9c4a00;
            --font-main: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: var(--font-main);
        }

        .dialogue-box {
            background: var(--oneshot-black);
            width: 720px;
            height: 160px;
            padding: 15px 25px;
            display: flex;
            flex-direction: row;
            border: 4px solid var(--oneshot-orange);
            border-radius: 4px;
            outline: 4px solid var(--oneshot-gold);
            box-shadow: 0 0 0 8px black;
        }

        .text-section {
            flex: 1;
            color: white;
            font-size: 1.6rem;
            line-height: 1.3;
            margin-top: 10px;
            word-wrap: break-word;
            overflow: hidden;
        }

        #typewriter-text {
            white-space: pre-wrap;
        }

        #url-link {
            color: #6fb6ff;
            text-decoration: none;
            display: inline-block;
            transition: color 0.2s;
        }

        #url-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .portrait-container {
            width: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 20px;
            padding-left: 10px;
        }

        .portrait {
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>

    <div class="dialogue-box">
        <div class="text-section">
            <span id="typewriter-text"></span><a id="url-link"
                href="https://niko-pancakes.github.io/oneshot-resources/"></a>
        </div>

        <div class="portrait-container">
            <img src="https://niko-pancakes.github.io/oneshot-resources/bookbot/bookbot.png" alt="Bookbot" class="portrait">
        </div>
    </div>

    <script>
        const robotBlip = new Audio('text_robot.wav');
        const textElement = document.getElementById('typewriter-text');
        const linkElement = document.getElementById('url-link');

        const message = "This page has been moved to...\n";
        const url = "https://niko-pancakes.github.io/oneshot-resources/";

        let index = 0;

        function typeWriter() {
            let isTypingMessage = index < message.length;
            let isTypingUrl = !isTypingMessage && index < (message.length + url.length);

            if (isTypingMessage || isTypingUrl) {
                let currentChar = isTypingMessage ? message[index] : url[index - message.length];

                const isPunctuation = /[.,!?]/.test(currentChar);
                const delay = isPunctuation ? 400 : 50;

                if (currentChar !== " ") {
                    robotBlip.currentTime = 0;
                    robotBlip.play().catch(() => { });
                }

                if (isTypingMessage) {
                    textElement.textContent += message[index];
                    index++;
                    setTimeout(typeWriter, delay);
                } else {
                    const urlCharIndex = index - message.length;
                    linkElement.textContent += url[urlCharIndex];
                    index++;
                    setTimeout(typeWriter, delay);
                }
            }
        }

        function startRedirectTimer() {
            setTimeout(() => {
                window.location.href = "https://niko-pancakes.github.io/oneshot-resources/";
            }, 10000); 
        }

        startRedirectTimer();
        window.onload = typeWriter;
    </script>

</body>

</html>
